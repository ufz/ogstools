name: hydrogen
group: gas
type: phase
domains:
- domain: phase
  properties:
    molar_mass:
    - type: Constant
      value: 0.002016
      unit: kg/mol
      source: CODATA 2018 recommended values
    specific_heat_capacity:
    - type: Constant
      value: 14300
      unit: J/(kg·K)
      source: NIST Chemistry WebBook
    thermal_conductivity:
    - type: Constant
      value:
        nominal_value: 0.1805
        unit: W/(m·K)
        distribution:
          type: uniform
          lower: 0.17
          upper: 0.19
      source: NIST Chemistry WebBook
    density:
    - type: Constant
      value: 0.08988
      unit: kg/m³
      source: NIST Chemistry WebBook
    viscosity:
    - type: Constant
      value:
        nominal_value: 8.76e-06
        unit: Pa·s
        distribution:
          type: uniform
          lower: 8.3e-06
          upper: 9.2e-06
      source: NIST Chemistry WebBook
    vapour_pressure:
    - type: Antoine
      A: 4.584
      B: 99.42
      C: -6.0
      unit: Pa
      source: NIST Chemistry WebBook
    specific_latent_heat:
    - type: Constant
      value: 446000
      unit: J/kg
      source: NIST Chemistry WebBook
    henry_coefficient:
    - type: Constant
      value:
        nominal_value: 1.28e-05
        unit: mol/(m³·Pa)
        distribution:
          type: loguniform
          lower: 8.0e-06
          upper: 2.0e-05
      source: Sander, R. (2015), Atmospheric Chemistry and Physics, 15, 4399–4981
