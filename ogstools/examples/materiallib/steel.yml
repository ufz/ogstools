name: steel
group: solid
type: phase
domains:
- domain: phase
  properties:
    molar_mass:
    - type: Constant
      value: 0.055845
      unit: kg/mol
      source: null
    specific_heat_capacity:
    - type: Constant
      value:
        nominal_value: 500
        unit: J/(kg·K)
        distribution:
          type: uniform
          lower: 450
          upper: 550
      source: null
    thermal_conductivity:
    - type: Constant
      value:
        nominal_value: 45
        unit: W/(m·K)
        distribution:
          type: uniform
          lower: 35
          upper: 55
      source: null
    density:
    - type: Constant
      value:
        nominal_value: 7850
        unit: kg/m³
        distribution:
          type: normal
          mean: 7850
          stddev: 100
      source: null
    youngs_modulus:
    - type: Constant
      value:
        nominal_value: 2.0e11
        unit: Pa
        distribution:
          type: normal
          mean: 200000000000.0
          stddev: 10000000000.0
      source: null
    poisson_ratio:
    - type: Constant
      value:
        nominal_value: 0.3
        unit: 1
        distribution:
          type: uniform
          lower: 0.27
          upper: 0.31
      source: null
    yield_strength:
    - type: Constant
      value:
        nominal_value: 250e6
        unit: Pa
        distribution:
          type: loguniform
          lower: 200000000.0
          upper: 400000000.0
      source: null
    thermal_expansivity:
    - type: Constant
      value:
        nominal_value: 1.2e-05
        unit: 1/K
        distribution:
          type: uniform
          lower: 1.0e-05
          upper: 1.5e-05
      source: null
- domain: medium
  properties:
    permeability:
    - type: Constant
      value: 1.0e-99
      unit: m²
    relative_permeability:
    - type: Constant
      value: 1.0
      unit: 1
    relative_permeability_nonwetting_phase:
    - type: Constant
      value: 1.0
      unit: 1
    saturation:
    - type: Constant
      value: 0.0
      unit: 1
    tortuosity:
    - type: Constant
      value: 1.0e+99
      unit: 1
    porosity:
    - type: Constant
      value: 0.0
      unit: 1
    bishops_effective_stress:
    - type: Constant
      value: 0.0
      unit: 1
    biot_coefficient:
    - type: Constant
      value: 0.0
      unit: 1
