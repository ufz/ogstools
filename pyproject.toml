docs = [
  "livereload",
  "myst-parser",
  "myst_nb",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-argparse >=0.2.5, <0.5.0",
  "sphinx-autodoc-typehints",
  "sphinx-design",
  "sphinx_gallery",
  "sphinxcontrib-apidoc",
  "sphinxcontrib-mermaid",
  "sphinxcontrib-programoutput",
  "snowballstemmer<3.0.0",
  "trame-vtk>=2.6.0",
  "pagefind[extended]",
]
feflow = ["ifm_contrib>=0.2.4"]
ogs = ["ogs>=6.5.8"]
monitor = ["bokeh>=3.6.0", "ipykernel>5", "jupyter_bokeh>=3.0.0"]
# all features (not extra for developer tasks (test,docs,dev,...))
all = ["ogstools[ogs,monitor]"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
  "-ra",
  "--showlocals",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "--log-cli-level=INFO",
  "--tb=short",
  "--mpl",
  "--durations=0",
  "--durations-min=10",
]
xfail_strict = true
markers = [
  "system: runs an OGS simulation",
  "tools: runs an OGS binary tool",
]
filterwarnings = ["ignore:Animation was deleted without rendering anything"]
# TODO: LB enable this again, deal with MatplotlibDeprecationWarning in fe2vtu
# tests
#filterwarnings = ["error"]
log_cli_level = "info"
testpaths = ["tests"]


[tool.black]
line-length = 80
exclude = '.*/examples/.*'

[tool.mypy]
files = "ogstools/**/*.py"
# does not work when mypy invoked directly, works in pre-commit as explicitly
# stated there again:
exclude = ['.*/examples/.*']
ignore_missing_imports = true
scripts_are_modules = true
# Set to true when current issues are fixed
strict = false
# Delete following lines when strict is true:
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true
enable_incomplete_feature = ["Unpack"]
show_absolute_path = true

[tool.ruff]
# target-version is read from requires-python
exclude = ["EXPERIMENTAL"]
line-length = 80

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",    # flake8
  "B",
  "B904", # flake8-bugbear
  "I",    # isort
  "ARG",  # flake8-unused-arguments
  "C4",   # flake8-comprehensions
  "EM",   # flake8-errmsg
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "G",    # flake8-logging-format
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RUF",  # Ruff-specific
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
  "EXE",  # flake8-executable
  "NPY",  # NumPy specific rules
  "PD",   # pandas-vet
  "A",       # flake8-builtins
  "T20",     # flake8-print
  "TRY002",  # raise-vanilla-class
  "LOG",     # flake8-logging
  "ERA001",  # commented-out code
  "TID251",  # banned-api
  "ANN401",  # any-type
  "D101",    # undocumented public class
  "D102",    # undocumented public method
  "D103",    # undocumented public function
  "D401",    # imperative summary line
  "PLR1714", # repeated-equality-comparison
  "PLR5501", # collapsible-else-if
]
extend-ignore = [
  "PLR",   # Design related pylint codes
  "E501",  # Line too long
  # RUF005 should be disabled when using numpy, see
  # https://github.com/charliermarsh/ruff/issues/2142:
  "RUF005",
  "PT009",   # can use unittest-assertion
  "PLC0415", # import-outside-top-level
  "E402",    # module-import-not-at-top-of-file
]
unfixable = [
  "T20",  # Removes print statements
  "F841", # Removes unused variables
]
flake8-unused-arguments.ignore-variadic-names = true
flake8-builtins.builtins-ignorelist = ["id"]
flake8-annotations.allow-star-arg-any = true
flake8-import-conventions.extend-aliases = { "ogstools" = "ot" }

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Shared
"sys.exit".msg = "Only command-line tools exit; raise an exception instead."
"logging.basicConfig".msg = "Do not configure logging in the library."
"sys.setrecursionlimit".msg = "Do not change global state."
"pint.UnitRegistry".msg = "Use ogstools.variables.u_reg."
"matplotlib.rcParams".msg = "Use ot.plot.setup."
"matplotlib.pyplot.rcParams".msg = "Use ot.plot.setup."
"pyvista.read".msg = "Use ot.mesh.read."
"meshio".msg = "Use ot.mesh.read and ot.mesh.save."
# OGSTools
"tempfile".msg = "Use ogstools.definitions.temp_dir() or temp_file()."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "D", "TID251"]
"docs/**" = ["T20", "D", "ERA001"]  # gallery syntax looks like code
"docs/examples/**" = ["B018"]
"ogstools/**/*_cli.py" = ["T20", "TID251"]  # command-line tools print and exit
"ogstools/definitions.py" = ["TID251"]  # implements temp_dir
"ogstools/mesh/file_io.py" = ["TID251"]  # implements ot.mesh.read and save
"ogstools/meshseries/_meshseries.py" = ["TID251"]  # XDMF input and output
"ogstools/meshseries/xdmf_reader.py" = ["TID251"]  # XDMF input
"ogstools/variables/unit_registry.py" = ["TID251"]  # defines u_reg
"ogstools/physics/nuclearwasteheat/_unitsetup.py" = ["TID251"]  # self-contained model with its own registry
"docs/gallery_hashes.py" = ["TID251"]  # script

