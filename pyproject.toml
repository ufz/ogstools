[build-system]
requires = ['setuptools', 'setuptools_scm[toml]']
build-backend = 'setuptools.build_meta'

[project]
name = "ogstools"
dynamic = ["version"]
description = "A collection of Python tools aimed at evolving into a modeling toolchain around OpenGeoSys."
authors = [{ name = 'OpenGeoSys Community', email = 'info@opengeosys.org' }]
license = { text = "BSD-3-Clause" }
keywords = [
  "opengeosys",
  "geoscience",
  "subsurface modeling",
  "hydrogeology",
  "numerical simulation",
  "finite element method",
  "groundwater flow",
  "geochemistry",
  "geotechnical engineering",
  "porous media",
  "contaminant transport",
  "mesh generation",
  "data visualization",
  "scientific computing",
  "open-source software",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Visualization",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
readme = "README.md"
requires-python = '>=3.11'
dependencies = [
  "gmsh>=4.12.0",
  "h5py>=3.8.0",
  "json5>=0.12.0",
  "jupytext>=1.14.0",
  # TODO: unrestrict, when 3.11 is working again
  "matplotlib >=3.7.1,<3.11",  # 3.11RC02 is failing our plot tests
  "meshio>=5.3.0",
  "pyvista[all]>=0.47.0",
  "numpy>=1.20.0",
  "scipy>=1.10.1",
  "shapely>=2.0.0",
  "simpleeval>=1.0.3",
  "Pint>=0.22",
  "papermill>=2.4.0",
  "typeguard>=4.0.0",
  "lxml>=4.6.0",
  "pandas>=2.2.3",
  "psutil>=5.0.0",
  "watchdog>=6.0.0",
  "PyYAML>=6.0.0",
  "types-PyYAML>=6.0.0.20240917",
  "vtk>=9.4.0",
  "imagehash>=4.3.2",
  "bokeh>=3.6.0"
]

[project.urls]
"Documentation" = 'https://ogstools.opengeosys.org'
"Bug Tracker" = 'https://discourse.opengeosys.org'
"Source Code" = 'https://gitlab.opengeosys.org/ogs/tools/ogstools'

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ogstools*"]
namespaces = false

[tool.setuptools_scm]
version_scheme = "no-guess-dev"   # would increment version otherwise
local_scheme = "dirty-tag"
fallback_version = "0.8.2+no-scm" # Manually increment on release!

[project.scripts]
msh2vtu = 'ogstools.msh2vtu._cli:cli'
feflow2ogs = 'ogstools.feflowlib._cli:cli'
yaml2vtu = 'ogstools.meshlib.meshes_from_yaml_cli:cli'
ogsmonitor = 'ogstools.logparser.monitor_cli:cli'

